<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d2a2a">
<title>보트 낚시 — Clearwater Fishing</title>
<style>
  :root { --ink: rgba(255,255,255,.9); --glass: rgba(8,26,30,.42); --font: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
  html, body { margin:0; height:100%; background:#0d2a2a; overflow:hidden; touch-action:none; -webkit-user-select:none; user-select:none; font-family:var(--font); color:var(--ink); }
  canvas#c, canvas#hud { position:fixed; inset:0; width:100%; height:100%; display:block; }
  canvas#hud { cursor:crosshair; }
  [hidden] { display:none !important; }
  .glass { background:var(--glass); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-radius:14px; }
  button { font:600 13px var(--font); color:#fff; background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.18); border-radius:999px; padding:5px 12px; cursor:pointer; transition:background .15s; }
  button:hover { background:rgba(255,255,255,.2); }
  button.on { background:#ffd84a; color:#1b1b12; border-color:#ffd84a; }
  #shop { position:fixed; inset:0; z-index:15; background:rgba(3,12,18,.55); display:grid; place-items:center; padding:16px; box-sizing:border-box; }
  #shop .shopbox { width:min(980px, 100%); max-height:100%; overflow:auto; background:rgba(6,22,30,.94); padding-bottom:14px; }
  #shop .coins { flex:1; font-size:13px; opacity:.85; } #shop .coins b { color:#ffd84a; }
  #shopgrid { padding:0 14px; }
  #shopgrid h3 { font-size:13px; margin:12px 0 8px; opacity:.7; letter-spacing:.08em; }
  #shopgrid .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:10px; }
  #shopgrid .card { padding:12px; border-radius:12px; background:rgba(255,255,255,.06); display:flex; flex-direction:column; gap:6px; font-size:12px; }
  #shopgrid .ct { font-weight:800; font-size:14px; }
  #shopgrid .cur span, #shopgrid .nx span { opacity:.7; }
  #shopgrid .nx { color:#bfeeff; } #shopgrid .nx.max { color:#8ff0a8; }
  #shopgrid button { margin-top:auto; background:#ffd84a; color:#1b1b12; border:0; font-weight:800; }
  #shopgrid button:disabled { background:rgba(255,255,255,.12); color:rgba(255,255,255,.45); cursor:not-allowed; }
  #card .tipc { font-size:12px; opacity:.8; margin-top:8px; line-height:1.5; }
  #map { position:fixed; inset:0; z-index:15; background:rgba(3,12,18,.55); display:grid; place-items:center; padding:16px; box-sizing:border-box; }
  #map .mapbox { width:min(1100px, 100%); height:min(680px, 100%); display:flex; flex-direction:column; overflow:hidden; background:rgba(6,22,30,.92); }
  .maphead { display:flex; align-items:center; gap:12px; padding:10px 14px; }
  .maphead b { font-size:15px; }
  #mapinfo { flex:1; font-size:12px; opacity:.65; font-variant-numeric:tabular-nums; }
  .mapbody { flex:1; display:flex; min-height:0; }
  .mapwrap { flex:1; position:relative; min-width:0; }
  #mapcv { position:absolute; inset:0; width:100%; height:100%; cursor:crosshair; touch-action:none; }
  #mappanel { width:240px; padding:14px; font-size:13px; display:flex; flex-direction:column; gap:10px; overflow:auto; }
  #mappanel .hint { opacity:.7; line-height:1.6; margin:0; }
  #mappanel .st b { display:block; font-size:18px; }
  #mappanel .st span { font-size:11px; opacity:.6; }
  #mappanel .tags { display:flex; flex-wrap:wrap; gap:4px; }
  #mappanel .tags span { font-size:11px; padding:2px 7px; border-radius:6px; background:rgba(79,209,255,.15); color:#bfeeff; }
  #mappanel .tags span.zone { background:rgba(143,240,168,.18); color:#c9f7d6; }
  #mappanel .tags span.zone.lock { background:rgba(255,120,100,.2); color:#ffc2b5; }
  #mappanel .need { font-size:12px; line-height:1.5; padding:8px 10px; border-radius:10px; background:rgba(255,120,100,.12); }
  #mappanel .need span { opacity:.75; }
  #mappanel button:disabled { opacity:.45; cursor:not-allowed; }
  #mappanel .fish { font-size:12px; line-height:1.6; opacity:.85; }
  #fade { position:fixed; inset:0; background:#06141c; opacity:0; pointer-events:none; transition:opacity .6s; z-index:25; display:grid; place-items:center; font-size:15px; letter-spacing:.1em; }
  #fade.on { opacity:1; }
  @media (max-width: 760px) { .mapbody { flex-direction:column; } #mappanel { width:auto; max-height:40%; } }
  #retrieve { position:fixed; right:14px; bottom:30px; z-index:5; }
  #help { position:relative; padding:9px 16px; font-size:13px; border-radius:999px; white-space:nowrap; z-index:4; pointer-events:none; max-width:calc(100vw - 260px); overflow:hidden; text-overflow:ellipsis; }
  #help:empty { display:none; }
  #help b { color:#ffe27a; font-weight:700; }
  #msg { position:fixed; left:50%; top:22%; transform:translate(-50%, 10px); font-size:24px; font-weight:800; text-shadow:0 2px 12px rgba(0,0,0,.55); opacity:0; transition:opacity .25s, transform .25s; pointer-events:none; z-index:16; white-space:nowrap; }
  #msg.show { opacity:1; transform:translate(-50%, 0); }
  #msg.hot { color:#ffdf4a; font-size:34px; }
  #msg.bad { color:#ff9a8a; }
  #card { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); width:300px; padding:20px 22px; text-align:center; z-index:10; background:rgba(8,26,30,.78); box-shadow:0 20px 60px rgba(0,0,0,.4); cursor:pointer; }
  #card[hidden] { display:none; }
  #card .t { font-size:12px; letter-spacing:.2em; opacity:.6; }
  #card .sp { font-size:30px; font-weight:900; margin-top:4px; }
  #card .latin { font-size:11px; font-style:italic; opacity:.55; }
  #card canvas { width:240px; height:100px; margin:8px auto 4px; display:block; }
  #card .photo { width:100%; max-height:180px; object-fit:cover; border-radius:10px; margin:10px 0 2px; display:block; }
  #card .credit { font-size:10px; opacity:.5; margin-bottom:6px; }
  #card .stats { display:flex; justify-content:center; gap:18px; font-size:18px; font-weight:700; }
  #card .pts { color:#ffd84a; font-size:20px; font-weight:800; margin-top:8px; }
  #card .badge { color:#8ff0a8; font-weight:700; font-size:13px; min-height:18px; margin-top:4px; }
  #card .foot { font-size:11px; opacity:.55; margin-top:10px; }
  #loading { position:fixed; inset:0; display:grid; place-items:center; background:#0d2a2a; z-index:20; transition:opacity .8s; font-size:14px; letter-spacing:.1em; }
  #loading.off { opacity:0; pointer-events:none; }
  #err { position:fixed; inset:auto 12px 12px 12px; max-height:45%; overflow:auto; font:12px/1.45 ui-monospace, Menlo, monospace; color:#ffd9d2; background:rgba(40,8,8,.92); border-radius:14px; padding:12px 14px; white-space:pre-wrap; z-index:30; }
  #err[hidden], #dbg[hidden] { display:none; }
  #dbg { position:fixed; top:8px; left:50%; transform:translateX(-50%); font:11px/1.4 ui-monospace, Menlo, monospace; color:#fff; background:rgba(0,0,0,.35); padding:6px 8px; border-radius:8px; z-index:8; pointer-events:none; }
  /* ---- touch UI ---- */
  #joy, #tctl { display:none; }
  body.touch #joy { display:block; position:fixed; left:calc(18px + env(safe-area-inset-left,0px)); bottom:calc(18px + env(safe-area-inset-bottom,0px));
    width:92px; height:92px; border-radius:50%; background:rgba(8,26,30,.38); border:2px solid rgba(255,255,255,.28);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); z-index:7; touch-action:none; }
  #knob { position:absolute; left:50%; top:50%; width:40px; height:40px; margin:-20px 0 0 -20px; border-radius:50%;
    background:rgba(255,255,255,.88); box-shadow:0 2px 10px rgba(0,0,0,.4); pointer-events:none; }
  #joy.on { border-color:#ffd84a; }
  body.touch #tctl { display:flex; gap:8px; align-items:flex-end; position:fixed; right:calc(14px + env(safe-area-inset-right,0px));
    bottom:calc(18px + env(safe-area-inset-bottom,0px)); z-index:7; touch-action:none; }
  .tcol { display:flex; flex-direction:column; gap:8px; align-items:center; }
  .tcol button { width:46px; height:46px; padding:0; border-radius:50%; font-size:20px; background:rgba(8,26,30,.5); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
  #tadj { font-size:10px; opacity:.75; text-shadow:0 1px 4px #000; }
  #act { width:92px; height:92px; border-radius:50%; padding:0; font:800 16px var(--font); background:#ffd84a; color:#1b1b12; border:0;
    box-shadow:0 6px 20px rgba(0,0,0,.35); touch-action:none; transition:transform .08s; }
  #act.down { transform:scale(.93); background:#ffe98a; }
  #act.hot { background:#ff7a59; color:#fff; animation:pulse .5s infinite alternate; }
  @keyframes pulse { to { transform:scale(1.08); } }
  @media (prefers-reduced-motion: reduce) { #act.hot { animation:none; } }
  body.touch #retrieve { right:calc(14px + env(safe-area-inset-right,0px)); bottom:calc(124px + env(safe-area-inset-bottom,0px)); }
  body.touch #help { max-width:calc(100vw - 380px); white-space:normal; text-align:center; font-size:12px; border-radius:12px; }
  body.touch #msg { font-size:20px; top:30%; white-space:normal; width:max-content; max-width:calc(100vw - 32px); text-align:center; line-height:1.3; }
  body.touch #itempop { left:50% !important; transform:translateX(-50%); width:230px; box-sizing:border-box; }
  body.touch #msg.hot { font-size:28px; }
  #mapzoom { display:flex; gap:6px; }
  #mapzoom button { width:34px; padding:5px 0; }
  @media (max-width: 760px) { #help { max-width:calc(100vw - 28px); white-space:normal; border-radius:14px; } }

  /* ---- HUD layout ---- */
  .seg { display:flex; gap:2px; padding:3px; border-radius:999px; background:var(--glass); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
  .seg button { border:0; background:transparent; }
  .seg button.on { background:#ffd84a; color:#1b1b12; }
  .seg button small { font-weight:500; opacity:.75; margin-left:4px; font-size:11px; }
  #qtrack { position:fixed; left:14px; top:calc(14px + env(safe-area-inset-top,0px)); padding:8px 12px; z-index:5; font-size:12px; max-width:min(300px, calc(100vw - 260px)); cursor:pointer; }
  #qtrack .qth { font-size:11px; opacity:.6; letter-spacing:.08em; margin-bottom:4px; }
  #qlist div { display:flex; gap:8px; justify-content:space-between; padding:2px 0; }
  #qlist div span { opacity:.7; font-variant-numeric:tabular-nums; white-space:nowrap; }
  #qlist div.done { color:#8ff0a8; }
  #target { position:fixed; left:14px; top:120px; padding:7px 12px; font-size:12px; z-index:5; max-width:280px; line-height:1.5; }
  #target .st { color:#ffd84a; letter-spacing:1px; }
  #target .why { opacity:.75; }
  #status { position:fixed; right:14px; top:calc(14px + env(safe-area-inset-top,0px)); width:220px; padding:10px 14px; z-index:5; font-size:12px; }
  #status .srow { display:flex; justify-content:space-between; align-items:baseline; font-size:14px; font-weight:700; font-variant-numeric:tabular-nums; }
  #status .srow b { color:#ffd84a; font-size:16px; }
  #status .srow2 { display:flex; justify-content:space-between; margin:3px 0 8px; opacity:.75; }
  #status .srow2 b { color:#fff; }
  #status .neth { display:flex; justify-content:space-between; font-weight:700; padding-top:6px; border-top:1px solid rgba(255,255,255,.12); }
  #netval { color:#ffd84a; }
  #catches { list-style:none; margin:4px 0 0; padding:0; max-height:170px; overflow:auto; }
  #catches li { display:flex; justify-content:space-between; gap:6px; padding:3px 0; border-top:1px solid rgba(255,255,255,.06); }
  #catches li span { opacity:.75; }
  .netbtns { display:flex; gap:6px; margin-top:6px; }
  .netbtns button { flex:1; font-size:11px; padding:4px 8px; }
  #gauges { position:fixed; left:14px; bottom:calc(14px + env(safe-area-inset-bottom,0px)); width:164px; padding:10px 12px; display:flex; flex-direction:column; gap:8px; z-index:5; }
  #tbar { position:relative; height:10px; border-radius:5px; background:rgba(0,0,0,.35); overflow:hidden; }
  #tbar::after { content:''; position:absolute; top:0; bottom:0; left:calc(100%/1.1); width:2px; background:#ff5a4a; }
  #tfill { position:absolute; left:0; top:0; bottom:0; width:0; background:linear-gradient(90deg,#8ff0a8,#46c36d); transition:width .08s linear; }
  #tfill.warn { background:linear-gradient(90deg,#ffe27a,#f0b53a); }
  #tfill.danger { background:linear-gradient(90deg,#ff8a70,#e2412e); }
  #dragmark { position:absolute; top:-2px; bottom:-2px; width:3px; background:#6fd3ff; box-shadow:0 0 6px #6fd3ff; }
  #ginfo { font-size:12px; display:flex; flex-direction:column; gap:4px; }
  #ginfo div { display:flex; justify-content:space-between; }
  #ginfo span { opacity:.65; }
  /* bottom dock: mode / tackle buttons, the hint line under them */
  #dock { position:fixed; left:50%; bottom:calc(14px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:10px; z-index:6; pointer-events:none; }
  #dock > * { pointer-events:auto; }
  #dock > #help { pointer-events:none; }
  #bottombar { position:relative; display:flex; gap:10px; align-items:center; }
  body.casting #bottombar { display:none; }
  #bottombar.locked #modes, #bottombar.locked #navtoggle { opacity:.5; }
  #itempop { position:absolute; bottom:calc(100% + 6px); left:0; width:max-content; max-width:240px; padding:5px; display:flex; flex-direction:column; background:rgba(8,26,30,.9); border-radius:12px; }
  #items { display:flex; flex-direction:column; align-items:stretch; gap:2px; }
  #items button { display:flex; flex-direction:column; align-items:flex-start; gap:1px; text-align:left; border:0; border-radius:8px; background:transparent; padding:6px 10px; white-space:normal; }
  #items button:hover { background:rgba(255,255,255,.1); }
  #items button.on { background:rgba(255,216,74,.16); color:#ffd84a; }
  #items button small { font-weight:500; font-size:10.5px; opacity:.65; color:#fff; line-height:1.35; }
  #itemdesc { display:none; }
  /* bottom controls 1.5x on desktop */
  body:not(.touch) #bottombar { transform:scale(1.5); transform-origin:50% 100%; margin-top:22px; }
  body:not(.touch) #menubtn { transform:scale(1.5); transform-origin:100% 100%; }
  body:not(.touch) #menu { bottom:calc(76px + env(safe-area-inset-bottom,0px)); transform:scale(1.5); transform-origin:100% 100%; }
  body:not(.touch) #retrieve { bottom:calc(80px + env(safe-area-inset-bottom,0px)); transform:scale(1.25); transform-origin:100% 100%; }
  /* quests 1.5x on desktop: tracker and quest window */
  body:not(.touch) #qtrack { font-size:18px; padding:12px 18px; max-width:min(460px, calc(100vw - 420px)); }
  body:not(.touch) #qtrack .qth { font-size:15px; }
  body:not(.touch) #questm .mbox { zoom:1.5; width:min(900px, calc(100vw/1.5 - 24px)); max-height:calc(100vh/1.5 - 24px); }
  #menubtn { position:fixed; right:14px; bottom:calc(14px + env(safe-area-inset-bottom,0px)); z-index:6; padding:9px 16px; border-radius:14px; font-size:14px; }
  #menu { position:fixed; right:14px; bottom:calc(62px + env(safe-area-inset-bottom,0px)); z-index:7; padding:8px; display:flex; flex-direction:column; gap:4px; min-width:190px; background:rgba(8,26,30,.85); }
  #menu button { text-align:left; border-radius:10px; border:0; background:transparent; padding:8px 12px; display:flex; justify-content:space-between; }
  #menu button:hover { background:rgba(255,255,255,.1); }
  #menu kbd { font:600 10px var(--font); opacity:.5; }
  #retrieve { right:14px; bottom:calc(62px + env(safe-area-inset-bottom,0px)); }
  .modal { position:fixed; inset:0; z-index:15; background:rgba(3,12,18,.55); display:grid; place-items:center; padding:16px; box-sizing:border-box; }
  .mbox { width:min(900px, 100%); max-height:100%; overflow:auto; background:rgba(6,22,30,.94); padding-bottom:14px; }
  .maphead .sub { flex:1; font-size:12px; opacity:.65; }
  .qtop { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 14px 10px; }
  .attend, .weekly { padding:12px; border-radius:12px; background:rgba(255,255,255,.06); display:flex; flex-direction:column; gap:8px; font-size:12px; }
  .ah { display:flex; justify-content:space-between; align-items:baseline; }
  .ah span { color:#ffd84a; font-weight:700; }
  #attdays { display:flex; gap:4px; }
  #attdays i { flex:1; text-align:center; font-style:normal; padding:6px 0; border-radius:8px; background:rgba(255,255,255,.06); font-size:11px; }
  #attdays i.got { background:rgba(110,230,140,.3); }
  #attdays i.today { outline:1px solid #ffd84a; }
  #attbtn:disabled { opacity:.45; cursor:default; }
  .wbar { height:10px; border-radius:5px; background:rgba(0,0,0,.35); overflow:hidden; }
  #wkfill { height:100%; width:0; background:linear-gradient(90deg,#6fd3ff,#8ff0a8); }
  #quests { padding:0 14px; display:grid; gap:8px; }
  .q { padding:12px; border-radius:12px; background:rgba(255,255,255,.06); display:grid; grid-template-columns:1fr auto; gap:4px 12px; align-items:center; }
  .q.done { background:rgba(110,230,140,.2); }
  .q .qt { font-weight:700; font-size:14px; }
  .q .rw { color:#ffd84a; font-weight:800; white-space:nowrap; text-align:right; }
  .q .prog { opacity:.7; font-variant-numeric:tabular-nums; margin-left:6px; font-weight:500; }
  .q .tip { font-size:12px; opacity:.8; line-height:1.5; grid-column:1 / -1; }
  .q .qw { font-size:11px; opacity:.6; }
  .q .go { justify-self:end; font-size:12px; padding:4px 12px; }
  .qfoot { padding:10px 14px 0; font-size:11px; opacity:.7; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .rtabs { display:flex; gap:6px; padding:0 14px 10px; flex-wrap:wrap; align-items:center; }
  .rtabs select { margin-left:auto; font:600 13px var(--font); background:rgba(255,255,255,.1); color:#fff; border:1px solid rgba(255,255,255,.2); border-radius:999px; padding:5px 10px; }
  .rtabs select option { color:#111; }
  #rlist { padding:0 14px; }
  #rlist table { width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums; }
  #rlist th { text-align:left; font-size:11px; opacity:.6; font-weight:600; padding:6px 8px; }
  #rlist td { padding:8px; border-top:1px solid rgba(255,255,255,.07); }
  #rlist tr.me td { background:rgba(255,216,74,.12); }
  #rlist .rk { width:36px; font-weight:800; color:#ffd84a; }
  #rlist .empty { opacity:.6; padding:20px 8px; font-size:13px; }
  #dexgrid { padding:0 14px; display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; }
  .dx { border-radius:12px; background:rgba(255,255,255,.06); overflow:hidden; font-size:12px; }
  .dx .ph { aspect-ratio:4/3; background:#0b2230; display:grid; place-items:center; overflow:hidden; position:relative; }
  .dx .qm { position:absolute; inset:0; display:grid; place-items:center; font-size:40px; color:rgba(255,255,255,.55); text-shadow:0 2px 10px #000; }
  .dx img { width:100%; height:100%; object-fit:cover; display:block; }
  .dx.locked img { filter:blur(12px) grayscale(1) brightness(.35); transform:scale(1.15); }
  .dx .nm { padding:6px 8px 0; font-weight:800; font-size:13px; }
  .dx .dd { padding:2px 8px 8px; opacity:.7; line-height:1.5; }
  .dx .tag { font-size:10px; padding:1px 6px; border-radius:6px; background:rgba(79,209,255,.15); color:#bfeeff; margin-left:4px; font-weight:600; }
  .cbox { width:min(360px, 100%); padding:18px; display:flex; flex-direction:column; gap:14px; background:rgba(6,22,30,.94); text-align:center; font-size:14px; line-height:1.6; }
  .cbtns { display:flex; gap:8px; justify-content:center; }
  .cbtns button { min-width:100px; }
  @media (max-width: 700px) { .qtop { grid-template-columns:1fr; } }
  /* touch layout */
  body.touch #navtoggle, body.touch #menubtn { display:none; }
  /* touch: tackle buttons at the bottom between the joystick and the action button (above them in portrait), hints above */
  body.touch #dock { bottom:calc(16px + env(safe-area-inset-bottom,0px)); gap:8px; }
  body.touch #help { max-width:calc(100vw - 460px); }
  @media (max-width: 640px) {
    body.touch #dock { bottom:calc(146px + env(safe-area-inset-bottom,0px)); }
    body.touch #help { max-width:calc(100vw - 32px); }
  }
  body.touch #menu { bottom:calc(130px + env(safe-area-inset-bottom,0px)); }
  /* the page blocks touch gestures for the game; windows with lists must still scroll with a finger */
  .mbox, .shopbox, #mappanel, #catches { touch-action:pan-y; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
  .seg button { white-space:nowrap; }
  body.touch #menu kbd { display:none; }
  /* touch: quests (left) and time/weather/coins (right) at the very top */
  body.touch #qtrack { top:calc(10px + env(safe-area-inset-top,0px)); left:10px; max-width:calc(100vw - 200px); box-sizing:border-box; font-size:11px; padding:7px 10px; }
  body.touch #qlist b { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  body.touch #qlist div span { display:none; }

  <div id="itempop" class="glass" hidden><div id="items"></div><div id="itemdesc"></div></div>
</div>
<div id="power" hidden><div class="pwbar"><div id="pwfill"></div></div><span>캐스팅 파워</span></div>
<div id="help"></div>
</div>

<!-- bottom right: menu -->
<button id="menubtn" class="glass">☰ 메뉴 <kbd id="menukey" style="font:600 10px var(--font);opacity:.55">Esc</kbd></button>
<div id="menu" class="glass" hidden>
  <button data-m="shop">🛒 상점 <kbd>P</kbd></button>
  <button data-m="quest">📜 퀘스트 <kbd>Q</kbd></button>
  <button data-m="map">🗺 지도 <kbd>M</kbd></button>
  <button data-m="rank">🏆 랭킹 <kbd>K</kbd></button>
  <button data-m="dex">📖 도감 <kbd>I</kbd></button>
  <button data-m="time">⏩ 다음 시간대 <kbd>T</kbd></button>
  <button data-m="set">⚙️ 환경설정 <kbd>O</kbd></button>
  <button data-m="dbg">🛠 디버그</button>
</div>
<button id="retrieve" hidden>회수 (R)</button>

<!-- touch controls: joystick (조그) + context action cluster -->
<div id="joy"><div id="knob"></div></div>
<div id="tctl">
  <div class="tcol"><button id="tnav" aria-label="보트/낚시 전환">⛵</button><button id="tnet" aria-label="살림망">🧺<small id="tnetn"></small></button><button id="tmap" aria-label="메뉴">☰</button></div>
  <div class="tcol"><span id="tadj">수심</span><button id="tplus" aria-label="올리기">+</button><button id="tminus" aria-label="내리기">−</button></div>
  <button id="act">던지기</button>
</div>

<div id="target" class="glass" hidden></div>
<div id="questm" class="modal" hidden>
  <div class="mbox glass">
    <div class="maphead"><b>📜 퀘스트</b><span class="sub" id="qsub"></span><button class="mclose xbtn" aria-label="닫기 (Esc)" title="닫기 (Esc)">✕</button></div>
    <div class="qtop">
      <div class="attend"><div class="ah"><b>출석 체크</b><span id="streak"></span></div><div id="attdays"></div><button id="attbtn">출석하기</button></div>
      <div class="weekly"><div class="ah"><b>이번 주 퀘스트</b><span id="wkpct"></span></div><div class="wbar"><div id="wkfill"></div></div><div id="wkstat"></div></div>
    </div>
    <div id="quests"></div>
  </div>
</div>
<div id="rankm" class="modal" hidden>
  <div class="mbox glass">
    <div class="maphead"><b>🏆 랭킹</b><span class="sub" id="rsub"></span><button class="mclose xbtn" aria-label="닫기 (Esc)" title="닫기 (Esc)">✕</button></div>
    <div class="rtabs"><button data-t="len" class="on">어종별 크기</button><button data-t="kg">어종별 무게</button><button data-t="day">하루 최다</button><select id="rsp"></select></div>
    <div id="rlist"></div>
  </div>
</div>
<div id="dexm" class="modal" hidden>
  <div class="mbox glass">
    <div class="maphead"><b>📖 도감 <span id="dcount"></span></b><span class="sub" id="dsub"></span><button id="dexback" class="xbtn" aria-label="뒤로" hidden>←</button><button class="mclose xbtn" aria-label="닫기 (Esc)" title="닫기 (Esc)">✕</button></div>
    <div id="dexgrid"></div>
    <div id="dexdet" hidden></div>
  </div>
</div>
<div id="setm" class="modal" hidden>
  <div class="mbox glass sbox">
    <div class="maphead"><b>⚙️ 환경설정</b><span class="sub">자동 저장돼요</span><button class="mclose xbtn" aria-label="닫기 (Esc)" title="닫기 (Esc)">✕</button></div>
    <div class="rtabs stabs"><button data-st="gfx" class="on">🖥 그래픽</button><button data-st="snd">🔊 사운드</button><button data-st="pad">🎮 패드</button></div>
    <div id="setbody"></div>
  </div>
</div>
<div id="netm" class="modal" hidden>
  <div class="mbox glass nbox">
    <div class="maphead"><b>🧺 살림망</b><span class="sub" id="netsub"></span><button class="mclose xbtn" aria-label="닫기 (Esc)" title="닫기 (Esc)">✕</button></div>
    <div id="netlist"></div>
    <div class="nbtns"><button id="nsell">모두 판매</button><button id="nrel">방생 <small>+25% · 🍀</small></button></div>
  </div>
</div>
<div id="dbgm" class="modal" hidden>
  <div class="mbox glass" style="width:min(380px,100%)">
    <div class="maphead"><b>🛠 디버그</b><span class="sub"></span><button class="mclose xbtn" aria-label="닫기 (Esc)" title="닫기 (Esc)">✕</button></div>
    <div class="dbgbtns">
      <button data-d="coins">🪙 코인 +1,000,000</button>
      <div class="dbgrow"><button data-d="gear">⚙️ 업그레이드 완료</button><button data-d="gearReset">⚙️ 업그레이드 초기화</button></div>
      <div class="dbgrow"><button data-d="dex">📖 도감 완료</button><button data-d="dexReset">📖 도감 초기화</button></div>
      <button data-d="bite">🎣 바로 입질 (캐스팅 후)</button>
      <div class="dbgrow"><button data-d="questDone">📜 현재 퀘스트 완료</button><button data-d="questReset">📜 퀘스트 초기화</button></div>
      <h4>시간</h4>
      <div class="dbgchips"><button data-d="time:5">새벽</button><button data-d="time:10">낮</button><button data-d="time:17.5">해질녘</button><button data-d="time:21">밤</button></div>
      <h4>파도</h4>
      <div class="dbgchips"><button data-d="wave:0.45">잔잔</button><button data-d="wave:1">중간</button><button data-d="wave:1.8">강하게</button><button data-d="wave:2.8">매우 강하게</button><button data-d="wave:4">폭풍</button></div>
      <h4>날씨</h4>
      <div class="dbgchips"><button data-d="w:clear">☀️ 맑음</button><button data-d="w:cloudy">☁️ 흐림</button><button data-d="w:rain">🌧️ 비</button><button data-d="w:fog">🌫️ 안개</button><button data-d="w:windy">💨 강풍</button></div>
    </div>
  </div>
</div>
<div id="confirm" class="modal" hidden>
  <div class="cbox glass"><div id="ctext"></div><div class="cbtns"><button id="cno">취소</button><button id="cyes" class="on">이동</button></div></div>
</div>
<div id="shop" hidden>
  <div class="shopbox glass">
    <div class="maphead"><b>🛒 낚시 용품점</b><span class="coins">보유 <b id="coins2">0</b>🪙</span><button id="shopclose" class="xbtn" aria-label="닫기 (Esc)" title="닫기 (Esc)">✕</button></div>
    <div id="shoptabs" class="rtabs"><button data-t="all" class="on">전체</button><button data-t="gear">⚙️ 장비</button><button data-t="bait">🪱 미끼</button><button data-t="lure">🎣 루어</button></div>
    <div id="shopgrid"></div>
  </div>
</div>
<div id="msg"></div>

<div id="card" class="glass" hidden>
  <div class="t">CATCH</div>
  <canvas width="480" height="200"></canvas>
  <img class="photo" alt="" hidden>
  <div class="credit" hidden></div>
  <div class="sp"></div>
  <div class="latin"></div>
  <div class="stats"><div class="st"><small>길이</small><span class="len"></span></div><div class="st"><small>무게</small><span class="wt"></span></div></div>
  <div class="pts"></div>
  <div class="badge"></div>
  <div class="tipc"></div>
  <div class="foot">클릭하여 계속</div>
</div>

<div id="map" hidden>
  <div class="mapbox glass">
    <div class="maphead"><b>🗺 세계 낚시 지도</b><span id="mapinfo" hidden></span><span class="sub"></span><button id="mapclose" class="xbtn" aria-label="닫기 (Esc)" title="닫기 (Esc)">✕</button></div>
    <div class="mapbody"><div class="mapwrap"><canvas id="mapcv"></canvas><span id="mapzoom"><button id="mapout" aria-label="축소">−</button><button id="mapin" aria-label="확대">+</button></span></div><div id="mappanel"></div></div>
  </div>
</div>
<div id="fade">⛵ 이동 중…</div>
<div id="loading">물 위로 나가는 중…</div>
<div id="dbg" hidden></div>
<div id="err" hidden></div>

<script src="js/pebbles.js"></script>
<script src="js/boat_b1.js"></script>
<script src="js/renderer.js"></script>
<script src="js/world.js"></script>
<script src="img/fish/credits.js"></script>
<script src="js/ecology.js"></script>
<script src="js/data.js"></script>
<script src="js/game.js"></script>
</body>
</html>
